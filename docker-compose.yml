services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ops_copilot}
      POSTGRES_USER: ${POSTGRES_USER:-ops_copilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ops_copilot} -d ${POSTGRES_DB:-ops_copilot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ops_copilot}
      POSTGRES_USER: ${POSTGRES_USER:-ops_copilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      # Empty unless set, which leaves the API unreachable from any browser page — the right
      # default for endpoints that issue refunds. Set it to run the operator console against this.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    ports:
      - "8080:8080"

volumes:
  postgres-data:
