name: Backend

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'pom.xml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Compile and unit-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # `verify` runs surefire and then failsafe, so this covers the five Testcontainers tests
      # as well — the ones that assert the guarantees worth having: three identical webhooks
      # produce one ticket, five concurrent approvals execute once, and an exhausted LLM retry
      # lands in ERROR rather than sitting in PROCESSING forever. Those need a real Postgres,
      # and the runner provides a Docker daemon at the standard socket, so nothing extra is
      # configured here. (Locally on Colima the socket is elsewhere — see the README.)
      - name: Tests
        run: ./mvnw -B verify
